<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Contact Form | Contact form</title>

</head>

<body>
  <main class="form-wrapper">
    <h1>Contact Us</h1>
    <form>
      <div class="form-group">
        <label for="fname">First Name </label>
        <input type="text" name="fname" id="fname" required>
      </div>
      <div class="form-group">
        <label for="lname">Last Name </label>
        <input type="text" name="lname" id="lname" required>
      </div>
      <div class="form-group form-group-full">
        <label for="email">Email Address </label>
        <input type="email" name="email" id="email" required>
      </div>
      <fieldset class="form-group-full">
        <legend>Query Type</legend>
        <div class="form-group">
          <input type="radio" name="query" id="general" required>
          <label for="general">General Enquiry</label>
        </div>
        <div class="form-group">
          <input type="radio" name="query" id="support" required>
          <label for="support">Support Request</label>
        </div>
      </fieldset>
      <div class="form-group form-group-full">
        <label for="message" >Message</label>
        <textarea name="message" id="message" placeholder="Hello, I would like to know if you're able to build Shopify e-commerce sites. We're starting a business and we're going to use Shopify. But it would be great to work with an agency who specialises in working with it." required></textarea>
      </div>
      <div class="form-group form-group-full">
        <input type="checkbox" name="consent" id="consent" required>
        <label for="consent">I consent to being contacted by the team</label>
      </div>
      <button class="form-group-full">Submit</button>
    </form>
  </main>

  </div> -->
</body>

</html>
